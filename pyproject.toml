[project]
name = "flights-skill"
version = "1.0.0"
description = "A Google Flights search script and MCP server"
readme = "README.md"
requires-python = ">=3.15,<3.16"
dependencies = [
    "fast-flights==3.1.0",
    "primp==2.0.1",
    "selectolax>=1.0.2,<2",
    "typing-extensions>=4.12",
]

[tool.uv]
package = false

[tool.uv.sources]
fast-flights = { git = "https://github.com/AWeirdDev/flights.git", rev = "4261437c506b228d20969910178a19e6d1bd2592" }

[tool.pylint.main]
# Allow Pylint to inspect selectolax's compiled HTML parser.
extension-pkg-allow-list = ["selectolax.lexbor"]
persistent = false

[dependency-groups]
dev = [
    "pylint>=4.1.3",
]
