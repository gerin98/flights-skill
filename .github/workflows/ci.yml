name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  checks:
    name: Lint and test (Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.13.6"
          enable-cache: true
      - name: Install Python from .python-version
        run: uv python install
      - name: Install locked dependencies
        run: uv sync --locked --managed-python --dev
      - name: Lint
        run: git ls-files -z '*.py' | xargs -0 uv run --locked --managed-python pylint
      - name: Test
        run: uv run --locked --managed-python python -m unittest discover -s tests -v
